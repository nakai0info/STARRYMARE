<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STARRYMARE | シューティングゲーム</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080e1b; color: #e8f1ff; font-family: system-ui, sans-serif; padding: 20px; }
  main { width: min(100%, 560px); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 22px; letter-spacing: .12em; margin: 0; }
  .tag { color: #64e8df; font-size: 11px; letter-spacing: .14em; }
  .stats { display: flex; justify-content: space-between; padding: 14px 18px; background: #142034; border: 1px solid #293950; border-radius: 12px 12px 0 0; font-size: 14px; }
  .stats strong { color: #77f0e2; font-variant-numeric: tabular-nums; }
  .arena { position: relative; }
  canvas { display: block; width: 100%; background: #0b1425; border: 1px solid #293950; border-top: 0; border-radius: 0 0 12px 12px; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #080e1bd9; border-radius: 0 0 12px 12px; padding: 24px; }
  .overlay[hidden] { display: none; }
  h2 { font-size: clamp(24px, 6vw, 36px); margin: 0 0 12px; }
  p { color: #aabbd1; font-size: 14px; line-height: 1.8; }
  button { cursor: pointer; padding: 13px 28px; border: 0; border-radius: 8px; background: #77f0e2; color: #08272b; font: bold 15px system-ui; }
  button:hover { background: #a2fff2; }
  button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  footer { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; font-size: 12px; color: #aabbd1; }
  kbd { color: #e8f1ff; background: #1d2a40; border-radius: 4px; padding: 3px 6px; }

  body { background: radial-gradient(ellipse at 15% 10%, #24345b 0, transparent 45%), radial-gradient(ellipse at 85% 90%, #312054 0, transparent 45%), #060b18; }
  main { width: min(100%, 580px); }
  header { padding: 8px 0; }
  h1 { font-weight: 900; text-shadow: 0 0 25px #6be8ff66; }
  .tag { border: 1px solid #5e879b; padding: 5px 8px; border-radius: 30px; }
  .stats { background: linear-gradient(110deg,#1d3048,#151d35); padding: 18px 20px; border-color:#4b6681; }
  .stats strong { font-size: 20px; margin-left: 8px; text-shadow: 0 0 14px #59e9d855; }
  .arena { box-shadow: 0 20px 90px #0008, 0 0 45px #41bcff12; }
  canvas { border-color: #4b6681; }
  .overlay { background: linear-gradient(180deg,#0a112845,#0a1128e8); backdrop-filter: blur(3px); }
  .overlay h2 { text-shadow: 0 0 30px #83e9ff70; }
  button { background: linear-gradient(120deg,#85ffde,#6ccaff); box-shadow: 0 5px 30px #61d7ee40; }
  .credits { text-align:center; font-size:11px; color:#8e9fb9; margin:14px 0 0; }
  a { color: #a2c4e2; }
  #sound { display:block; margin:14px auto 0; font-size:11px; padding:7px 14px; background:#23304a; color:#c6d8ec; box-shadow:none; }
  @media (min-width: 600px) { main { width: min(580px, max(320px, calc((100dvh - 230px) * .8))); } }
  #mission {background:#111e34;color:#adcce8;font-size:11px;text-align:center;padding:9px 4px;letter-spacing:.04em;border-inline:1px solid #4b6681;}
  .tag {white-space:nowrap;font-size:10px;}
  @media (min-width:600px) {main {width:min(580px,max(320px,calc((100dvh - 270px)*.8)));}}
[hidden]{display:none!important;}
  .overlay{justify-content:flex-start;overflow-y:auto;padding:26px 22px;}
  .overlay h2{font-size:26px;letter-spacing:.08em;flex-shrink:0;}
  .overlay>p{margin:0 0 18px;font-size:12px;}
  #menu-panel{width:100%;} .menu-options{display:grid;gap:12px;}
  .menu-options button{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding:16px 20px;text-align:left;}
  .menu-options strong{letter-spacing:.08em;font-size:16px;}
  .menu-options small{font-size:11px;font-weight:400;}
  .back-button{background:#24344f;color:#d8e8ff;box-shadow:none;margin-top:8px;}
  .menu-copy{text-align:left;} .menu-copy p{font-size:12px;margin:0 0 15px;}.menu-copy strong{color:#eaf6ff;font-weight:700;}.menu-copy br{display:block;content:"";margin-top:8px;}
  .help-entry{padding:10px 0;border-top:1px solid #344460;display:grid;gap:5px;font-size:11px;line-height:1.6;}
  .help-entry span{color:#a8bdd6;}
  #pause-button{display:block;margin:14px auto 0;padding:8px 16px;font-size:11px;background:#24344f;color:#d8e8ff;box-shadow:none;}
  .tag{font-size:9px;} header h1{font-size:20px;}
#debug-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:12px;} #debug-controls button{font-size:11px;padding:9px 16px;} #debug-speed[aria-pressed="true"]{background:#ffcf70;} #debug-controls button:disabled{opacity:.4;cursor:default;} .help-visual{margin:0 0 14px;padding:12px;background:#14243b;border:1px solid #344d67;border-radius:10px;text-align:center;} .help-visual figcaption{font-size:11px;color:#cee7fc;margin-top:7px;} .control-picture{display:flex;align-items:center;justify-content:space-around;gap:12px;color:#8fe5ff;font-size:14px;} .control-picture img{width:48px;height:52px;object-fit:contain;} .enemy-gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;} .enemy-gallery img{width:100%;height:36px;object-fit:contain;} .item-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;} .item-gallery figure{padding:4px;} .item-gallery canvas{width:56px;height:56px;margin:auto;border:0;} .boss-help-image{width:160px;height:100px;margin:auto;border:0;background:#14243b;border-radius:8px;} #game{touch-action:none;user-select:none;-webkit-user-select:none;} button{touch-action:manipulation;} .touch-instructions{display:none;}
@media (pointer:coarse){.touch-instructions{display:inline;}.keyboard-instructions{display:none;} button,#pause-button,#debug-controls button{min-height:44px;} .overlay{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}}
@media (max-width:600px){body{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));align-items:start;} main{width:min(100%,480px,calc((100svh - 180px)*.8));min-width:min(280px,100%);} header{margin-bottom:7px;padding:4px 0;} header h1{font-size:17px;} .stats{padding:9px 12px;font-size:11px;}.stats strong{font-size:16px;margin-left:4px;} #mission{font-size:10px;padding:6px 3px;} .overlay{padding:18px 14px;} .overlay h2{font-size:22px;} .menu-options{gap:9px;}.menu-options button{padding:12px 15px;} footer{margin-top:10px;font-size:11px;} #pause-button{margin-top:8px;} #debug-controls{gap:6px;} #debug-controls button{padding:8px 12px;}}
@media (max-height:500px) and (pointer:coarse){body{display:block;} main{margin:auto;width:min(100%,360px)!important;}.overlay{padding:14px;}}
#item-status{position:absolute;top:9%;left:6px;width:76%;max-width:360px;height:auto;z-index:1;pointer-events:none;border:0;border-radius:0;background:transparent;}
.arena>.overlay{z-index:2;}
.home-menu{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.home-menu button{align-items:center;justify-content:center;text-align:center;min-width:0;padding:16px 4px;}
.home-menu button strong{font-size:clamp(10px,2.8vw,14px);line-height:20px;letter-spacing:.025em;}
.home-menu button[data-action="play"]{grid-column:1/-1;height:78px;}
.home-menu button[data-action="play"] strong{font-size:20px;letter-spacing:.12em;}
@media(max-width:600px){.home-menu{gap:9px;}.home-menu button{padding:12px 3px;}.home-menu button[data-action="play"]{height:66px;}}

.stats{align-items:center;gap:8px;}
.stats #pause-button{flex-shrink:0;margin:0;padding:8px 9px;font-size:10px;white-space:nowrap;}
@media(max-width:600px){.stats{padding:9px 8px;gap:5px;}.stats #pause-button{font-size:9px;padding:8px 6px;}}
.overlay[data-state="clear"]{background:radial-gradient(ellipse at center,#17495cf5,#071326fa 75%);justify-content:center;animation:clear-reveal .7s ease-out both;}
.overlay[data-state="clear"] h2{font-size:clamp(38px,10vw,64px);letter-spacing:.18em;color:#a4ffe8;}
@keyframes clear-reveal{from{opacity:0;clip-path:inset(48% 0);}to{opacity:1;clip-path:inset(0);}}
@media(prefers-reduced-motion:reduce){.overlay[data-state="clear"]{animation:none;}}
#debug-items{display:contents;}
/* Auto margins center short menus and collapse safely for scrollable long menus. */
.overlay,.overlay[data-state="clear"]{justify-content:flex-start;}
.overlay-content{width:100%;flex:none;margin-block:auto;display:flex;flex-direction:column;align-items:center;}
.overlay-content>p{margin:0 0 18px;font-size:12px;}
.overlay-content>button{width:100%;min-height:44px;flex:none;}
.overlay .menu-options button{justify-content:center;}
.overlay .home-menu button{min-height:104px;}

.overlay .home-menu button[data-action="play"]{height:156px;min-height:156px;}
@media(max-width:600px){
 .overlay .home-menu button{min-height:88px;}
 
 .overlay .home-menu button[data-action="play"]{height:132px;min-height:132px;}
}

header h1{font-family:'Monoton',sans-serif;font-weight:400;font-size:clamp(22px,5vw,30px);letter-spacing:.02em;color:#b6fff2;text-shadow:0 2px 0 #21496a,0 0 18px #55dfff66;}
.overlay[data-route="home"] #title{font-family:'Monoton',sans-serif;font-weight:400;font-size:clamp(40px,10vw,66px);line-height:1.05;letter-spacing:.025em;max-width:100%;margin-bottom:20px;color:#bafff1;background:linear-gradient(180deg,#ffffff 10%,#bafff0 45%,#51c9ef 78%,#a9a6ff);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #183958) drop-shadow(0 0 12px #4fc9e855);text-shadow:none;}
#message{white-space:pre-line;}
.overlay[data-state="menu"]:not([data-route="home"]) #title{font-family:'Monoton',sans-serif;font-weight:400;color:#fff;font-size:clamp(28px,7vw,40px);letter-spacing:.025em;line-height:1.1;text-shadow:0 0 18px #ffffff22;}
#result-details{width:100%;text-align:left;margin:0 0 20px;}
.result-table{width:100%;border-collapse:collapse;font-size:clamp(10px,2.6vw,13px);line-height:1.65;color:#cee3f2;font-variant-numeric:tabular-nums;}
.result-table th,.result-table td{padding:3px 0;vertical-align:top;text-align:left;}
.result-table th[scope="row"]{white-space:nowrap;font-weight:700;color:#fff;width:1%;}
.result-table .result-colon{width:14px;min-width:14px;text-align:center;}
.result-table .result-section{font-size:14px;font-weight:800;color:#fff;padding:12px 0 5px;border-bottom:1px solid #8bc9dc44;}
#floating-back{position:absolute;z-index:4;bottom:14px;left:22px;right:22px;width:calc(100% - 44px);min-height:44px;margin:0;border:1px solid #52718d;background:#1c3049f5;color:#e8f5ff;box-shadow:0 -5px 22px #020916aa;backdrop-filter:blur(10px);}
#floating-back:hover{background:#35516d;}
.overlay[data-back="true"]{padding-bottom:84px;scroll-padding-bottom:84px;}
@media(max-width:600px){#floating-back{left:14px;right:14px;width:calc(100% - 28px);bottom:10px;}.overlay[data-back="true"]{padding-bottom:76px;scroll-padding-bottom:76px;}}
#drive-button{position:absolute;z-index:1;left:10px;bottom:52px;width:128px;height:78px;padding:10px 5px;clip-path:none;border-radius:18px;background:linear-gradient(to top,#70eadb var(--charge,0%),#183148 var(--charge,0%));box-shadow:none;color:#fff;text-shadow:0 1px 3px #000;font-size:11px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:7px;}
#drive-button:disabled{cursor:default;}#drive-button[data-ready="true"]{background:linear-gradient(#c6fff3,#39c4df);color:#09263b;text-shadow:none;filter:drop-shadow(0 0 9px #73ffe8);}
#drive-panel{position:absolute;inset:0;z-index:5;overflow-y:auto;background:#050b1af2;backdrop-filter:blur(8px);padding:22px 16px;display:flex;flex-direction:column;justify-content:safe center;text-align:center;}
#drive-panel h2{font-family:'Monoton',sans-serif;font-weight:400;font-size:clamp(25px,7vw,38px);color:#fff;}
.drive-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.drive-card{min-width:0;min-height:190px;padding:18px 9px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;border:1px solid var(--drive-color);background:linear-gradient(160deg,color-mix(in srgb,var(--drive-color) 32%,#142239),#0a1328);color:#fff;box-shadow:inset 0 0 24px #ffffff08;font-size:13px;}
.drive-card strong{overflow-wrap:anywhere;letter-spacing:.06em;}.drive-card small{font-weight:400;font-size:11px;line-height:1.7;}.drive-symbol{font-size:38px;color:var(--drive-color);}.drive-cancel{margin-top:18px;background:#25354f;color:white;box-shadow:none;}
@media(max-width:600px){#drive-button{width:110px;height:70px;font-size:9px;bottom:46px;}.drive-card{min-height:160px;padding:14px 6px;}.drive-cards{gap:8px;}}
/* Separate the drive control from the HUD's bottom 60px status band. */
#drive-button{bottom:100px;width:140px;height:82px;}
@media(max-width:600px){#drive-button{bottom:90px;width:120px;height:74px;}}
.guide-section{margin:0 0 22px;}.guide-section h3,.guide-drive h3{font-size:14px;color:#effaff;margin:0 0 8px;line-height:1.5;}
.guide-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;line-height:1.85;}
.guide-table th,.guide-table td{vertical-align:top;text-align:left;padding:7px 0;border-bottom:1px solid #6685a026;overflow-wrap:anywhere;}
.guide-table th{width:27%;font-weight:750;color:#effaff;}.guide-table .guide-colon{width:14px;text-align:center;color:#abc9df;}.guide-table td:last-child{color:#bbcee0;}.guide-table strong{color:#fff;}
.guide-bosses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}.guide-bosses .help-visual{min-width:0;margin:0;padding:8px 4px;}.guide-bosses canvas{width:100%;max-width:160px;}.guide-bosses figcaption{font-size:10px;line-height:1.6;}
.guide-drive{border:1px solid var(--drive-color);border-radius:10px;padding:12px;margin-bottom:12px;background:#0c1729;}.guide-drive>.drive-symbol{text-align:center;}.guide-drive .guide-section{margin:0;}.guide-drive .guide-section>h3{display:none;}
@media(max-width:600px){.guide-table{font-size:11px;}.guide-table th{width:29%;}.guide-section{margin-bottom:18px;}}
/* Logo resolves in 1.8s; only then do the controls begin their 3s reveal. */
.overlay[data-route="home"] #title{position:relative;transform-origin:center;will-change:transform,opacity,filter;}
.overlay[data-route="home"][data-intro="waiting"] #title{opacity:0;visibility:hidden;}
.overlay[data-route="home"][data-intro="waiting"] .home-menu button strong{opacity:0;}
.overlay[data-route="home"][data-intro="running"] #title{animation:home-logo-in 1.8s cubic-bezier(.16,1,.3,1) both;}
.overlay[data-route="home"] .home-menu button{border:1px solid #8eece3;background:linear-gradient(120deg,#1f494c,#213b55);color:#c8fff5;}
.overlay[data-route="home"] .home-menu button:hover{background:linear-gradient(120deg,#32696b,#355674);}
.overlay[data-route="home"][data-intro="running"] .home-menu button strong{animation:home-controls-in 3s ease-out 1.8s both;}
.overlay[data-route="home"][data-intro="running"] #title::after{content:"";position:absolute;left:-8%;right:-8%;top:0;height:2px;background:linear-gradient(90deg,transparent,#bffff6,white,#7ccfff,transparent);box-shadow:0 0 16px #8ffff5;animation:home-scan 1.8s ease-in-out both;pointer-events:none;}
.overlay[data-route="home"][data-intro="complete"] #title{animation:home-logo-idle 6s ease-in-out infinite;}
@keyframes home-logo-in{0%{opacity:0;clip-path:inset(48% 0);transform:perspective(600px) rotateX(28deg) scale(1.12);filter:blur(9px) drop-shadow(0 0 22px #6dfaff);}45%{opacity:1;clip-path:inset(0);transform:perspective(600px) rotateX(0) scale(1.025);filter:blur(1px) drop-shadow(0 0 18px #6dfaff);}100%{opacity:1;clip-path:inset(0);transform:translateY(0) scale(1);filter:drop-shadow(0 3px 0 #183958) drop-shadow(0 0 12px #4fc9e855);}}
@keyframes home-scan{0%{opacity:0;transform:translateY(0);}20%{opacity:.9;}85%{opacity:.7;}100%{opacity:0;transform:translateY(120px);}}
@keyframes home-controls-in{0%{opacity:0;}100%{opacity:1;}}
@keyframes home-logo-idle{0%,100%{transform:translateY(0);filter:drop-shadow(0 3px 0 #183958) drop-shadow(0 0 10px #4fc9e855);}50%{transform:translateY(-3px);filter:drop-shadow(0 3px 0 #183958) drop-shadow(0 0 17px #4fc9e877);}}
@media(prefers-reduced-motion:reduce){.overlay[data-route="home"][data-intro="running"] #title{animation:none;}.overlay[data-route="home"][data-intro="running"] #title::after{display:none;}.overlay[data-route="home"][data-intro="running"] .home-menu button strong{animation:home-controls-in .001s linear both;}.overlay[data-route="home"][data-intro="complete"] #title{animation:none;}@keyframes home-controls-in{from{opacity:0;}to{opacity:1;}}}
/* CRT scan lines stay inside each home button and never intercept input. */
.overlay[data-route="home"] .home-menu button{position:relative;overflow:hidden;isolation:isolate;--scan-period:3.4s;--flicker-period:2.6s;--effect-offset:0s;}
.overlay[data-route="home"] .home-menu button:nth-child(2){--scan-period:3.1s;--flicker-period:2.3s;--effect-offset:-.7s;}
.overlay[data-route="home"] .home-menu button:nth-child(3){--scan-period:3.8s;--flicker-period:2.8s;--effect-offset:-1.4s;}
.overlay[data-route="home"] .home-menu button:nth-child(4){--scan-period:3.6s;--flicker-period:2.5s;--effect-offset:-2s;}
.overlay[data-route="home"] .home-menu button::before{content:"";position:absolute;z-index:0;left:0;right:0;top:-16px;height:16px;pointer-events:none;background:linear-gradient(to bottom,#bafff577 0 1px,transparent 1px 12px,#8addff40 12px 14px,transparent 14px);mask-image:repeating-linear-gradient(90deg,#000 0 7px,#0005 7px 10px,#000b 10px 21px);animation:home-button-scan var(--scan-period) linear var(--effect-offset) infinite;}
.overlay[data-route="home"] .home-menu button strong{position:relative;z-index:1;}
.overlay[data-route="home"][data-intro="complete"] .home-menu button strong{animation:home-button-flicker var(--flicker-period) linear var(--effect-offset) infinite;}
@keyframes home-button-scan{from{top:-16px;}to{top:100%;}}
@keyframes home-button-flicker{0%,88%,94%,100%{opacity:1;text-shadow:0 0 8px #a7fff166;}90%,92%{opacity:.48;text-shadow:none;}91%,93%{opacity:.9;text-shadow:0 0 11px #a7fff1aa;}}
@media(prefers-reduced-motion:reduce){.overlay[data-route="home"] .home-menu button::before{display:none;animation:none;}.overlay[data-route="home"][data-intro="complete"] .home-menu button strong{animation:none;}}
.home-logo-stage{display:contents;}
.home-flyby{display:none;}
.overlay[data-route="home"] .home-logo-stage{display:grid;place-items:center;position:relative;width:100%;}
.overlay[data-route="home"][data-intro="complete"] .home-flyby{display:block;position:absolute;inset:-45px -22px -25px;overflow:hidden;pointer-events:none;z-index:5;}
.home-flyby-craft{position:absolute;top:50%;width:64px;height:64px;margin-top:-32px;animation:home-ship-pass 2s cubic-bezier(.35,0,.65,1) 5s both;}
.home-flyby-craft img{display:block;width:64px;height:64px;object-fit:contain;transform:rotate(90deg);filter:drop-shadow(-6px 0 9px #58eaff);}
.home-flyby-trail{position:absolute;right:48px;top:26px;width:180px;height:12px;background:linear-gradient(90deg,transparent,#40bbff55 30%,#7eefffcc 82%,#efffff);clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);filter:drop-shadow(0 0 5px #56dfff);}
.home-flyby-trail::after{content:"";position:absolute;inset:5px 0;background:linear-gradient(90deg,transparent,#fff);}
@keyframes home-ship-pass{from{left:-220px;}to{left:calc(100% + 220px);}}
@media(prefers-reduced-motion:reduce){.overlay[data-route="home"][data-intro="complete"] .home-flyby{display:none;}.home-flyby-craft{animation:none;}}
.overlay .home-menu button[data-action="play"] strong{font-size:clamp(28px,6vw,36px);}
.mode-menu button{position:relative;overflow:hidden;isolation:isolate;border:1px solid #4a7a91;background:linear-gradient(120deg,#132839,#19243e);color:#d6f9ff;transition:border-color .25s,box-shadow .25s,background .25s;}
.mode-menu button strong,.mode-menu button small,.mode-state{position:relative;z-index:1;}
.mode-menu button::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#9dffff24 48%,#caffff66 50%,#9dffff24 52%,transparent 65%);transform:translateX(-150%);}
.mode-menu button::after{content:"";position:absolute;inset:6px;border:1px solid #72efff33;clip-path:polygon(0 0,18px 0,18px 2px,2px 2px,2px 18px,0 18px,0 0,100% 0,100% 100%,calc(100% - 18px) 100%,calc(100% - 18px) calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) calc(100% - 18px),100% calc(100% - 18px),100% 0);pointer-events:none;}
.mode-menu button[aria-pressed="true"]{border-color:#a3fff0;background:linear-gradient(120deg,#15484c,#20375c);box-shadow:inset 0 0 26px #7ffff51f,0 0 22px #58eaff4d;animation:mode-lock .4s ease-out;}
.mode-menu button[aria-pressed="true"]::before{animation:mode-sweep 2.6s ease-in-out infinite;}
.mode-menu button[aria-pressed="true"]::after{border-color:#acfff4;}
.mode-state{display:block;font-size:10px;letter-spacing:.12em;color:#91aabf;}
.mode-menu button[aria-pressed="true"] .mode-state{color:#bdfff1;}
#launch-fade{position:absolute;inset:0;z-index:50;background:#030915;pointer-events:auto;border-radius:0 0 12px 12px;}
@keyframes mode-sweep{0%{transform:translateX(-150%);}55%,100%{transform:translateX(150%);}}
@keyframes mode-lock{from{filter:brightness(1.6);}to{filter:brightness(1);}}
@media(prefers-reduced-motion:reduce){.mode-menu button,.mode-menu button[aria-pressed="true"],.mode-menu button[aria-pressed="true"]::before{animation:none;transition:none;}}
/* Compact reactor module; charge is readable without covering the lower HUD. */
.enemy-gallery figure{margin:0;text-align:center;}.enemy-gallery figcaption{font-size:9px;line-height:1.5;color:#bbd4e5;}
#drive-button{width:128px;height:64px;bottom:100px;padding:11px 8px 9px;gap:4px;border:1px solid #769bab99;border-radius:0;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);background:linear-gradient(135deg,#0a1e2ee8,#1e1833e8);color:#bcefff;text-shadow:0 0 7px #54cfff66;filter:none;box-shadow:inset 0 0 15px #63e4ff12;}
#drive-button>span{font:600 9px/1.35 system-ui;letter-spacing:.15em;}
#drive-button>small{font:700 9px/1 system-ui;letter-spacing:.2em;color:#8cbbd0;}
#drive-button::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:3px;background:linear-gradient(90deg,#8bfff0 var(--charge,0%),#47637855 var(--charge,0%));pointer-events:none;}
#drive-button[data-ready="true"]{background:linear-gradient(135deg,#123b43ee,#252245ee);border-color:#a9fff0;color:#ddfff8;filter:none;text-shadow:0 0 8px #6affd577;}
#drive-button[data-ready="true"]>small{color:#abffe7;}
@media(max-width:600px){#drive-button{width:112px;height:60px;bottom:90px;}#drive-button>span{font-size:8px;}}
#fullscreen-button{display:none;position:absolute;top:8px;right:8px;z-index:10;min-height:44px;padding:7px 10px;align-items:center;gap:6px;border:1px solid #77cdd477;border-radius:7px;background:#0c2034dc;color:#c5fff4;box-shadow:none;font:600 10px/1.2 system-ui;letter-spacing:.08em;}
.overlay[data-state="menu"][data-route="home"] #fullscreen-button{display:flex;}
#fullscreen-button .fullscreen-icon{font-size:22px;line-height:1;}
#fullscreen-button:disabled{opacity:.55;cursor:default;}
:fullscreen body{padding:8px;}
:fullscreen main{width:min(580px,max(280px,calc((100dvh - 240px)*2/3)),calc(100vw - 16px));}
/* Monoton has wider letterforms; size headings against their actual container. */
header,.overlay-content,#drive-panel{container-type:inline-size;}
header h1{font-size:clamp(14px,5.2cqw,26px);}
.overlay[data-route="home"] #title{font-size:clamp(20px,9.8cqw,56px);line-height:1.25;}
.overlay[data-state="menu"]:not([data-route="home"]) #title{font-size:clamp(16px,6cqw,32px);line-height:1.35;overflow-wrap:anywhere;}
#drive-panel h2{font-size:clamp(18px,6cqw,32px);line-height:1.35;overflow-wrap:anywhere;}

<main>
  <header><h1>STARRYMARE</h1><span class="tag" id="phase">PHASE 1 / 6</span></header>
  <div class="stats"><span>SCORE <strong id="score">00000</strong></span><span>LIFE <strong id="life">♥ ♥ ♥</strong></span><button id="pause-button" type="button">PAUSE / MENU</button></div>
  <div id="mission" role="status">迎撃 → ボス撃破 × 6フェーズ</div>
  <div class="arena">
    <canvas id="item-status" width="480" height="84" aria-label="アイテム効果一覧" hidden></canvas>
    <canvas id="game" width="480" height="720" aria-label="シューティングゲーム。ドラッグまたは矢印キーで移動。自機は常に自動射撃します。">Canvasに対応するブラウザで開いてください。</canvas>
    <div class="overlay" id="overlay">
      <button id="fullscreen-button" type="button" aria-label="全画面表示に切り替え" aria-pressed="false"><span class="fullscreen-icon" aria-hidden="true">⛶</span><span id="fullscreen-label">FULLSCREEN</span></button>
      <div class="overlay-content">
      <div class="home-logo-stage">
        <h2 id="title">宇宙のパトロールへ。</h2>
        <div class="home-flyby" aria-hidden="true"><span class="home-flyby-craft"><i class="home-flyby-trail"></i><img id="home-flyby-ship" alt="" draggable="false"></span></div>
      </div>
      <p id="message">全6フェーズ。各25秒の迎撃後にボス出現！<br>自動射撃で迎撃！ 敵機・敵弾を避けよう。<br>敵の通過ではダメージなし。<br>被害後2秒間保護・ボス撃破でライフ＋1。</p>
      <div id="result-details" hidden></div>
      <div id="menu-panel"></div>
      <button id="start" type="button" hidden>ゲームスタート</button>
      <button id="pause-sound" type="button" hidden>SOUND : OFF</button>
      <button id="menu-home" type="button" class="back-button" hidden>MAIN MENU</button>
      </div>
    </div>
    <button id="drive-button" type="button" disabled hidden aria-label="SINGULARITY DRIVE 充填中"><span>SINGULARITY<br>DRIVE</span><small id="drive-charge">0%</small></button>
    <div id="drive-panel" role="dialog" aria-modal="true" aria-label="SINGULARITY DRIVE選択" hidden></div>
    <button id="floating-back" class="back-button" type="button" hidden>← BACK</button>
    <div id="launch-fade" aria-hidden="true" hidden></div>

function updatePhase(dt) {
  const enemyDt=dt;
  if(state !== 'playing') return;
  phaseTime += dt;
  if(phaseMode === 'wave') {
    if(phaseTime >= WAVE_SECONDS) enterBoss();
  } else if(phaseMode === 'entry') {
    const halfHeight=bossSkins[phase-1].height/2;
    boss.y = -halfHeight-20+(90+halfHeight*2)*Math.min(1,phaseTime/2);
    if(phaseTime >= 2) {phaseMode = 'boss';phaseTime = 0;}
  } else if(phaseMode === 'transition') {
    transitionTime -= dt;
    if(returnMotion) {
      returnMotion.time += dt;
      const t=Math.max(0,Math.min(1,(returnMotion.time-RETURN_DELAY)/RETURN_DURATION));
      // Smoothstep: start and finish with zero velocity, independent of frame rate.
      const eased=t*t*(3-2*t);
      player.x=returnMotion.x+(W/2-returnMotion.x)*eased;
      player.y=returnMotion.y+(H-65-returnMotion.y)*eased;
    }
    if(phase===MAX_PHASES && returnMotion){
      const launchTime=Math.max(0,returnMotion.time-(RETURN_DELAY+RETURN_DURATION+.35));
      if(launchTime>0){
        player.y=H-65-1100*launchTime;
        missionLabel.textContent='MISSION COMPLETE · 離脱中';
        if(player.y < -110){
          returnMotion=null;state='clear';finishHistory('clear');keys.clear();
          showOverlay('CLEAR',`全6フェーズ突破！ 最終スコア：${score} 点。残りライフ：${life}`, '最初からプレイ');
        }
      }
    } else if(transitionTime<=0){phase++;beginPhase();}
  } else if(boss) {
    boss.clock += enemyDt; boss.hit = Math.max(0,boss.hit-dt);
    boss.x = phase===6 ? W/2 : W/2 + Math.sin(boss.clock*(.65+phase*.07))*(W/2-bossSkins[phase-1].width/2-12);
    for(let i=bullets.length-1;i>=0;i--) {
      const b = bullets[i];
      if(bossHullHit(b.x,b.y,b.r)) {
        registerShotHit();bullets.splice(i,1); boss.hp=Math.max(0,Math.round((boss.hp-(b.damage??1))*10)/10); boss.hit=.08;
        if(boss.hp<=0) {defeatBoss();phaseHUD();return;}
      }
    }
    if(bossHullHit(player.x,player.y,player.r)) damage();
    if(state !== 'playing') return;
    if(!attack) {
      boss.cooldown -= enemyDt*(isRushMode()?1.3:1);
      if(boss.cooldown<=0) prepareAttack();
    } else {
      updateBossAttack(enemyDt*(isRushMode()?1.3:1));
    }
  }
  if(state==='playing' && phaseMode==='boss' && boss)updateBossEscorts(enemyDt);
  // 通常戦・ボス戦の両方で敵弾を更新する。
  if(state === 'playing') {
    for(const b of hostileBullets) {
      if(b.homing){
        b.age+=enemyDt;const heading=Math.atan2(b.vy,b.vx),target=Math.atan2(player.y-b.y,player.x-b.x);
        const difference=Math.atan2(Math.sin(target-heading),Math.cos(target-heading));
        const next=heading+Math.max(-.9*enemyDt,Math.min(.9*enemyDt,difference));
        b.vx=Math.cos(next)*160;b.vy=Math.sin(next)*160;
      }
      b.x+=b.vx*enemyDt; b.y+=b.vy*enemyDt;
      if(Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r) {damage();b.y=H+40;}
    }
    hostileBullets=hostileBullets.filter(b=>(!b.homing||b.age<8)&&b.y>-20 && b.y<H+20 && b.x>-20 && b.x<W+20);
  }
  phaseHUD();
}

let bossEscorts=[],escortTimer=1.5;
function clearBossEscorts(reward=false){for(const e of bossEscorts){burst(e.x,e.y,'#ffb879');if(reward)dropEscortItems(e.x,e.y);}bossEscorts=[];}
function updateBossEscorts(dt){
 escortTimer-=dt;
 if(escortTimer<=0){
  const max=phase>=4?3:2;
  for(let slot=0;slot<max;slot++)if(!bossEscorts.some(e=>e.slot===slot)){
   const x=80+slot*(W-160)/(max-1);
   bossEscorts.push({x,y:-25,targetX:x,slot,hp:(3+Math.floor(phase/2))*(isRushMode()?3:1),fire:1.8,age:0});
   rings.push({x,y:150,life:.5,color:'#ffbb77'});
  }
  notices.push({x:W/2,y:190,text:'ESCORTS INBOUND',life:1.3});escortTimer=8;return;
 }
 for(let i=bossEscorts.length-1;i>=0;i--){const e=bossEscorts[i];e.age+=dt;e.y=Math.min(170,e.y+95*dt);e.x=e.targetX+Math.sin(e.age*1.4)*22;
  const hit=bullets.findIndex(b=>Math.hypot(e.x-b.x,e.y-b.y)<22);
  if(hit>=0){registerShotHit();e.hp=Math.round((e.hp-(bullets[hit].damage??1))*10)/10;bullets.splice(hit,1);if(e.hp<=0){burst(e.x,e.y,'#ffb879');dropEscortItems(e.x,e.y);awardKill(100);updateHUD();bossEscorts.splice(i,1);continue;}}
  if(Math.hypot(player.x-e.x,player.y-e.y)<32)damage();
  // A fatal collision finalizes the score; do not process further escorts afterward.
  if(state!=='playing')return;
  e.fire-=dt;if(e.y>=150 && e.fire<=0){const angle=Math.atan2(player.y-e.y,player.x-e.x);for(let i=0;i<(isRushMode()?3:1);i++){const heading=angle+(isRushMode()?(i-1)*.22:0);hostileBullets.push({x:e.x,y:e.y+18,vx:Math.cos(heading)*160,vy:Math.sin(heading)*160,r:5,kind:'normal',homing:isRushMode(),age:0});}e.fire=2.6;rings.push({x:e.x,y:e.y,life:.3,color:'#ffbb77'});}
 }
}
function drawBoss() {

  items:{title:'ITEMS',parent:'help',text:'アイテム説明',body:'<p>■ <strong>ドロップ</strong>：通常敵の撃破時に27%でドロップ（SHIELD 7%、1WAY 7%、BUDDY 4%、LIFE 3%、SPEED 2%、FIRE 4%、なし73%）。アイコン：盾＝SHIELD、分岐矢印＝1WAY、双機＝BUDDY、十字＝LIFE、矢印＝SPEED、炎＝FIRE。下へ流れ、8秒後からフェードして10秒で消えます。</p><p>■ <strong>SHIELD</strong>：1.5秒無敵。重複取得で残り時間に加算。<br>■ <strong>1WAY</strong>：取得ごとに射撃方向が1本増え、1→2→3→4→5方向に強化。連射間隔は一定。<br>■ <strong>BUDDY</strong>：僚機を1機追加。本体込み最大3機。全機が自動射撃し、1WAY・FIREも共有。僚機には被弾判定なし。本体が被弾時は僚機を1機失ってライフを保護。肩代わり後も2秒間無敵。<br>■ <strong>LIFE</strong>：ライフ＋1、最大3。<br>■ <strong>SPEED</strong>：10秒間、自機の移動速度が1.3倍。重複取得は時間加算（倍率は1.3倍のまま）。<br>■ <strong>FIRE</strong>：自機・僚機の弾が取得数で変化（1〜3個：白い光弾／4〜6個：青い菱形弾／7〜9個：赤い双槍弾／10個：黄色レーザー）。取得ごとに攻撃力＋0.1倍、最大10個で2倍。フェーズ移動後も維持。有効な被弾で1個分（0.1倍）低下し、最低1倍。僚機の肩代わり時も減少しますが、シールド・被弾後の無敵中は減りません。SPEEDは重複で時間加算し、残り時間を次フェーズへ持ち越します。</p><p>■ <strong>効果表示</strong>：上部のアイコン横は現在数／最大数です（1WAY最大4個で5方向、BUDDY最大2機、FIRE最大10個で2倍）。SHIELD・SPEEDは時間加算式で上限がないため残り秒数を表示します。各効果は併用可能。ボス撃破時に1WAYのみを文字・自機のパーティクル演出付きでリセット。BUDDYはフェーズをまたいで維持。上限後の取得は上限を維持します。</p>'},
  controls:{title:'CONTROLS',parent:'help',text:'ゲームの操作説明',body:'<p>■ <strong>マウス／タッチ</strong>：ドラッグ・スワイプの方向へ一定速度で移動し続けます。移動距離は速度に影響せず、押している間は最後の入力方向を維持。マウスボタンや指を離すと停止。<br>■ <strong>PC</strong>：↑ ↓ ← →で移動<br>■ <strong>攻撃</strong>：自動連射（ボタン操作不要）<br>■ <strong>PAUSE / MENUボタン</strong>：一時停止・メニューへ<br>■ <strong>P / Esc</strong>：一時停止・再開<br>■ <strong>DEBUG専用</strong>：RATEで1／2／3倍速を切替。SKIPは通常戦→ボス→次フェーズの通常戦の順に進みます。登場演出・帰還中は押せません。最終フェーズのSKIPはクリア画面へ進みます。SHIELD／1WAY／BUDDY／SPEED／FIREは対応アイテムを1個取得。RESETは射撃強化・僚機・アイテムシールド・SPEED・FIREを解除し、ライフを初期値3に戻します（DEBUGの残機0でも続行する仕様は維持）。</p><p>■ <strong>メニュー操作</strong>：メニューはクリック、または ↑ ↓ と Enter で選択。Tab キーでも移動できます。Esc は前の画面へ戻ります。</p>'},
  enemies:{title:'ENEMIES',parent:'help',text:'敵機の説明',body:()=>'<p>■ <strong>通常敵</strong>：従来の20種類＋追加パックの9船体、計29種類。フェーズが進むほど出現数が増加。約1.7〜2.8秒間隔で自機を狙い、1回の発射弾数はフェーズ1〜6で1〜6発に増加。弾は追尾しません。画面下に抜けてもダメージはありません。</p>'+bossNames.map((name,i)=>`<div class="help-entry"><canvas class="boss-help-image" width="160" height="100" data-boss="${i+1}" role="img" aria-label="${bossSkins[i].name}"></canvas><strong>■ PHASE ${i+1}：${name} / ${bossSkins[i].name}</strong><span>${attackNames[i].map(name=>'<strong>'+name+'</strong>').join(' ／ ')}</span></div>`).join('')+'<p>■ <strong>ボス共通</strong>：ボスはフェーズが進むほど大型化・重装甲化します。フェーズ1〜5は画面上部を横移動し、最終ボスは中央に固定。最終ボスのコアはゆっくり点滅します。8秒間隔で僚機を補充（前半最大2機、後半最大3機）。僚機は1機につき1〜3個のアイテムを必ずドロップ。本体撃破時の僚機全滅でも同じ個数をドロップします。各ボスは固有の3種類の攻撃を順番に使用します。予告の線・円を確認して回避しましょう。</p>'},
  rules:{title:'RULES',parent:'help',text:'ゲームのルール',body:'<p>■ <strong>TOD</strong>：フェーズ開始〜ボス撃破を計測（停止・帰還演出を除外）。25秒未満：LIGHTNING +5000、25秒以上35秒未満（34秒台まで）：QUICK +2000。35秒以上は称号・TODボーナスなし。完了フェーズごとにリザルトで加算。DEBUGのSKIPは対象外、倍速中はゲーム内時間で計測。</p><p>■ <strong>CLASS</strong>：有効被弾0＝COLONEL +10000、1〜10＝MAJOR +5000、11〜20＝CAPTAIN +3000、21以上＝CREW +0。僚機の肩代わりも被弾に含みます。</p><p>■ <strong>スコア</strong>：撃破10機ごとにCOMBO +0.1倍（最大1.5）、被弾でリセット。PHASE倍率は1〜6で1.0〜1.5倍。撃破点に両倍率を乗算。上限を超えたFIRE・1WAY・BUDDY・LIFEはOVERFLOW +50（倍率対象外）。CLASS・TODはCLEAR／GAME OVER時に一度だけ加算。</p><p>■ <strong>ライフ</strong>：ライフは3。敵機との接触、敵弾・ボス攻撃への被弾で1減少。僚機がいる場合は1機が肩代わりし、ライフは減りません。被弾後2秒間は保護されます。</p><p>■ <strong>通常敵撃破</strong>：100点。ボス撃破：フェーズ×1,000点、ライフ＋1（最大3）。第6ボス撃破でクリア。</p><p>■ <strong>STARRYMARE</strong>：各18秒の通常戦＋ボス戦。<br>■ <strong>BOSS RUSH</strong>：通常戦なしで6体と連戦。専用調整：ボスHP5倍、攻撃頻度1.3倍。ボス僚機はHP3倍、1〜5個ドロップ、緩やかな追尾弾を3発発射（最大8秒で消滅）。COMBOは被弾までの通常弾の命中回数で計算（20回で1.2倍、以後10回ごとに+0.2倍、160回で最大4倍）。SINGULARITY DRIVEのダメージ・撃破はCOMBO回数に加算しません。SINGULARITY DRIVEは戦闘時間10秒で充填（帰還・停止・カード選択中を除外）。左下ボタンがREADYになると使用可能。5種類から2枚を選出し、1枚を選ぶと全体攻撃。選択中はTODも停止。CANCELでは充填を消費せず、候補も変わりません。使用後は再充填し、残量は次フェーズへ持ち越します。TACHYON CASCADEは10秒間の連射1.5倍、ZERO-POINT BURSTは5秒間の防御フィールドを追加。両効果は併用でき、再取得は時間加算。帰還中も時間が進み、停止・選択中は止まります。残り時間は画面下部に表示。<br>■ <strong>DEBUG</strong>：STARRYMAREと同じ進行で、残機0でも続行。シールドは通常通り。残機1以下で受けた有効ダメージ数をリザルトに表示。</p>'},
  setting:{title:'SETTING',parent:'home',text:'設定と制作情報',items:[['SOUND','sound','効果音のON / OFF'],['CREDIT','credit','素材・ライセンス'],['PATCH NOTES','patch-notes','バージョンと変更履歴']]},
  'patch-notes':{title:'PATCH NOTES',parent:'setting',text:'バージョンを選択',body:'<p>新しい順に表示。v0.xは会話で確認できた変更を整理するために今回付けた番号です。当時の公開バージョンや日付を示すものではありません。</p>',items:()=>patchHistory.map(([version,summary])=>['v'+version,'patch-'+version,summary])},
  sound:{title:'SOUND',parent:'setting',text:'効果音の設定',body:'<p>射撃・被弾・ボス攻撃の効果音を切り替えます。設定はこのブラウザに保存されます。</p>',items:()=>[[soundEnabled?'SOUND : ON':'SOUND : OFF','toggle-sound','クリックまたはEnterで切り替え']]},
  credit:{title:'CREDIT',parent:'setting',text:'素材とライセンス',body:'<p>タイトルフォント：<strong>Monoton</strong> / Vernon Adams<br><a href="https://fonts.google.com/specimen/Monoton" target="_blank" rel="noopener">配布元：Google Fonts</a><br><a href="https://openfontlicense.org/" target="_blank" rel="noopener">SIL Open Font License 1.1</a>（商用利用可）<br>フォントとライセンスをHTML内に同梱。</p><p>画像素材：Kenney Vleugels<br>Space Shooter Redux / Space Shooter Extension</p><p><a href="https://opengameart.org/content/space-shooter-redux" target="_blank" rel="noopener">Redux 配布ページ（OpenGameArt）</a><br><a href="https://kenney.nl/assets/space-shooter-extension" target="_blank" rel="noopener">Extension 配布ページ（Kenney）</a><br><a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0 / パブリックドメイン</a></p><p>ボスは2つの素材パックの船体・翼・砲塔・円盤を組み合わせて構成。画像はHTML内に埋め込んでいます。効果音はWeb Audioで生成。</p>'}
};

// Mode guides share a semantic table layout; labels and colons align throughout each section.
function helpSection(title,rows){return '<section class="guide-section"><h3>■ '+title+'</h3><table class="guide-table"><tbody>'+rows.map(([name,detail])=>'<tr><th scope="row">'+name+'</th><td class="guide-colon">:</td><td>'+detail+'</td></tr>').join('')+'</tbody></table></section>';}
function helpBossGallery(){return '<div class="guide-bosses">'+bossNames.map((name,i)=>'<figure class="help-visual"><canvas class="boss-help-image" width="160" height="100" data-boss="'+(i+1)+'" role="img" aria-label="'+name+'"></canvas><figcaption><strong>PHASE '+(i+1)+' · '+name+'</strong><br>'+attackNames[i].join(' / ')+'</figcaption></figure>').join('')+'</div>';}
function commonGuide(){return helpPictures('controls')+
 helpSection('CONTROLS',[
 ['MOVE','矢印キー、またはドラッグ／スワイプ。最後の入力方向へ一定速度で移動し、指・ボタンを離すと停止。'],
 ['SHOT','自機・僚機とも自動射撃。'],['PAUSE','上部の<strong>PAUSE / MENU</strong>、P、Escで停止・再開。停止画面の<strong>SOUND</strong>で効果音ON／OFFを切替。戦闘・TOD・履歴は維持。'],['MENU','クリック／Tab＋Enterで操作。モードは1回押して選択、同じボタンをもう1回押すと出撃。別のモードを押すと選び直し。↑↓でフォーカス移動。BACKは画面下部に固定。']])+
 helpPictures('items')+helpSection('ITEMS',[
 ['SHIELD','<strong>7%</strong> · 1.5秒間無敵。重複で時間加算。'],
 ['1WAY','<strong>7%</strong> · 1個ごとに1方向追加、最大5方向。フェーズ終了時に解除。'],
 ['BUDDY','<strong>4%</strong> · 最大2機追加。自身に被弾判定はなく、本体被弾時に1機がライフを肩代わり。フェーズ持ち越し。'],
 ['LIFE','<strong>3%</strong> · ライフ＋1、最大3。'],
 ['SPEED','<strong>2%</strong> · 10秒間、移動速度1.3倍。時間加算・フェーズ持ち越し。'],
 ['FIRE','<strong>4%</strong> · 1個ごとに威力＋0.1倍、最大10個で2倍。持ち越し可能。有効被弾で1個減少（僚機の肩代わりも対象）。'],
 ['FIRE COLOR','1〜3個：白い光弾／4〜6個：青い菱形弾／7〜9個：赤い双槍弾／10個：黄色レーザー。'],
 ['DROP','通常敵は合計27%。8秒後から薄くなり、10秒で消滅。ボス僚機の個数はモード別。'],
 ['OVERFLOW','上限到達後の1WAY・BUDDY・FIRE・LIFE取得で<strong>＋50点</strong>。倍率対象外。時間加算型には適用なし。']])+
 helpSection('LIFE / SCORE',[
 ['DAMAGE','敵機・敵弾・攻撃範囲への接触で被弾。シールド・被弾後2秒間の保護中は無効。敵が画面外に抜けても被害なし。'],
 ['BASE SCORE','通常敵・ボス僚機：100点。ボス：フェーズ×1,000点。撃破点にCOMBOとPHASE倍率を乗算。'],
 ['PHASE','フェーズ1〜6で<strong>1.0／1.1／1.2／1.3／1.4／1.5倍</strong>。COMBO条件はモード別。'],
 ['CLEAR','全6ボス撃破。定位置へ帰還し、上方離脱後にリザルトを表示。']])+
 helpSection('RESULT / TOD',[
 ['TOD','フェーズ開始〜ボス撃破のゲーム内時間。停止・帰還演出・DRIVE選択中を除外。'],
 ['LIGHTNING','<strong>＋5,000点／完了フェーズ</strong>。STARRYMARE系：50秒未満。BOSS RUSH系：25秒未満。'],['QUICK','<strong>＋2,000点／完了フェーズ</strong>。STARRYMARE系：50秒以上65秒未満。BOSS RUSH系：25秒以上35秒未満。上限以上は称号なし。'],['LIFE BONUS','リザルト確定時の<strong>残機1につき＋1,000点</strong>。BUDDYは含めません。残機0は＋0。最終ボス撃破後の回復を含む残機で計算。'],
 ['CLASS','有効被弾0：<strong>COLONEL ＋10,000</strong><br>1〜10：<strong>MAJOR ＋5,000</strong><br>11〜20：<strong>CAPTAIN ＋3,000</strong><br>21以上：<strong>CREW ＋0</strong>'],
 ['BONUS','CLASS・TOD・LIFE BONUSはCLEAR／GAME OVER時に一度だけ加算。倍率対象外。途中でMENUに戻った場合は加算なし。DEBUGのSKIPはそのフェーズのTOD対象外。'],
 ['HISTORY','日時・モード・スコア・到達フェーズ・結果を保存。HISTORYのCLEARで削除可能。']]);}
function startGuide(){return helpPictures('enemies')+helpSection('STARRYMARE',[["MANEUVER","敵の外見ごとに斜め航行・停止迎撃・蛇行・クランク航行・弧状旋回・加速突入。進路の変化を読んで回避。"],["EMITTER","ボスは予告中に攻撃子機を展開。子機が着いた地点から弾やレーザー、爆雷が発動。子機自体には接触判定・撃破報酬なし。"],
 ['MISSION','各フェーズで<strong>25秒の通常戦→ボス</strong>。全6フェーズ。'],['ENEMIES','通常敵29種類・6種類の機動。<strong>HPはPHASE 1〜2：1、3〜4：2、5〜6：3</strong>。後半ほど数が増え、1回の発射弾数は1〜6発。画面への登場から<strong>0〜0.5秒で初回射撃</strong>。以後は従来間隔。弾速は据え置き・追尾なし。'],
 ['COMBO','被弾までの撃破数で計算。10機で1.1倍、以後10機ごとに＋0.1倍、最大1.5倍。有効被弾でリセット。'],
 ['ESCORTS','ボス僚機は前半最大2機・後半最大3機。8秒間隔で補充。狙い弾1発、1機撃破でアイテム1〜3個。'],
 ['BOSS','HPは前バージョンの1.5倍。PHASE 6はさらに3倍。3種類の予告付き攻撃を順番に使用。1〜5は横移動、6は中央固定。'],['BOSS HP',Array.from({length:6},(_,i)=>'PHASE '+(i+1)+'：<strong>'+bossHealth(i+1,'normal')+'</strong>').join('<br>')],['TOD','<strong>50秒未満：LIGHTNING</strong>／50秒以上65秒未満：QUICK／65秒以上：称号なし。通常戦・ボス登場・ボス戦を含み、停止・帰還は除外。'],['VICTORY','ボス撃破でライフ＋1（最大3）。1WAYを解除し、FIRE・BUDDYは維持。']])+helpBossGallery();}
function rushGuide(){return helpSection('BOSS RUSH',[
 ['MISSION','通常戦を省略し、強化された6体のボスと連戦。'],['BOSS','本モードのHPはv2.1.0から変更なし。通常戦を省略し、攻撃頻度はSTARRYMAREの1.3倍。フェーズ4の回転弾幕以外を増量。最終包囲弾は0.5秒間隔の2波。'],
 ['BOSS HP',Array.from({length:6},(_,i)=>'PHASE '+(i+1)+'：<strong>'+bossHealth(i+1,'rush')+'</strong>').join('<br>')],['TOD','25秒未満：<strong>LIGHTNING</strong>／25秒以上35秒未満：QUICK／35秒以上：称号なし。'],['COMBO','自機・僚機の通常弾の<strong>命中回数</strong>を計測。20回で1.2倍、以後10回ごとに＋0.2倍、160回で最大4倍。被弾でリセット。DRIVEは命中数に加算しません。'],
 ['ESCORTS','HP3倍。緩やかな追尾弾3発（最大8秒）。1機につきアイテム1〜5個。']])+
 helpSection('SINGULARITY DRIVE',[["REACTOR","左下の小型リアクターメーター。充填バーとREADY表示を確認して押す。"],["EMITTER","ボス本体から展開される攻撃子機が発射地点を示す。子機自体には接触判定なし。予告線・爆撃範囲から退避。"],
 ['CHARGE','左下の小型リアクターメーター。戦闘時間10秒でREADY。帰還・停止・カード選択中は充填停止。残量は持ち越し。'],['SELECT','押すと戦闘・TODを停止し、5種類からランダムな2枚を提示。CANCELは消費なし・候補変更なし。'],
 ['ATTACK','敵弾・攻撃予告を消去し、僚機を一掃。展開した崩壊波がボスの装甲を侵食。使用後は再充填。']])+
 '<div class="guide-drives">'+driveTypes.map(d=>'<section class="guide-drive" style="--drive-color:'+d.color+'"><div class="drive-symbol" aria-hidden="true">'+d.symbol+'</div><h3>■ '+d.name+'</h3>'+helpSection('EFFECT',[['PHENOMENON',d.detail]])+'</section>').join('')+'</div>'+
 helpSection('PASSIVE',[
 ['TACHYON','<strong>10秒間、連射速度1.5倍</strong>。'],['ZERO-POINT','<strong>5秒間、自動防御フィールド</strong>。被弾・COMBOリセットを防ぐ。'],['DURATION','両効果は併用可能。再取得で時間加算。帰還中も減少し、停止・選択中は停止。残り時間は下部に表示。']])+helpBossGallery();}
function debugGuide(mode=null){return helpPictures('rules')+helpSection('DEBUG',[
 ['SELECT','PLAY → DEBUG → <strong>STARRYMARE - DBG</strong>／<strong>BOSS RUSH - DBG</strong>。1回押して選択、同じボタンをもう1回押すと出撃。'],
 ['STARRYMARE - DBG','STARRYMAREと同じ25秒通常戦・敵HP・ボスHP・TOD・撃破COMBO。通常戦とボス戦を検証。'],
 ['BOSS RUSH - DBG','BOSS RUSHと同じボスHP・弾幕・僚機・命中COMBO・TOD。通常戦なしの6ボス連戦。'],
 ['SURVIVAL','両モードとも<strong>残機0でも続行</strong>。シールドは通常通り。被弾時のBUDDY肩代わり、FIRE減少、COMBOリセットも通常通り。'],
 ['DAMAGE','残機1以下でライフに受けた有効ダメージをリザルトに表示。シールド・僚機で防いだ分は除外。CLASS用被弾数は僚機の肩代わりも含む。'],
 ['RESULT','CLASS・TOD・残機ボーナスを通常と同じ条件で計算。HISTORYはモード別に保存。']])+
 helpSection('DEBUG BUTTONS',[
 ['RATE','ゲーム速度を1→2→3倍に切替。TODもゲーム内時間で進行。'],
 ['SKIP','STARRYMARE - DBG：通常戦→ボス→次フェーズ通常戦。BOSS RUSH - DBG：ボス→次フェーズのボス。登場・帰還中は無効。SKIPしたフェーズはTOD称号なし。'],
 ['ITEMS','<strong>SHIELD・1WAY・BUDDY・SPEED・FIRE</strong>を各1個取得。'],
 ['RESET','アイテム効果と僚機を解除、ライフを3に回復。スコア・TOD・被弾数は維持。'],
 ['PAUSE','停止・帰還中はアイテム取得／RESETを無効化。SOUNDは停止画面で切替可能。'],
 ['DRIVE','<strong>BOSS RUSH - DBG専用</strong>。ボス戦中、充填待ちなしでメーターを押せます。全5種類から任意の1枚を選択。使用後も再使用可能。威力・追加効果はBOSS RUSHと同じ。選択中は戦闘・TOD停止。']])+(mode==='debug'?startGuide():mode==='rush-debug'?rushGuide().replace('戦闘時間10秒でREADY。','DEBUGでは充填待ちなしでREADY。').replace('5種類からランダムな2枚を提示。','全5種類を提示。').replace('使用後は再充填。','DEBUGでは使用後も再使用可能。'):'');}
menuRoutes['help-common']={title:'COMMON',parent:'help',text:'共通操作・アイテム・スコア',body:commonGuide};
menuRoutes['help-start']={title:'STARRYMARE',parent:'help',text:'通常戦から全6ボスへ',body:startGuide};
menuRoutes['help-rush']={title:'BOSS RUSH',parent:'help',text:'強化ボス連戦・必殺技',body:rushGuide};
menuRoutes['help-debug']={title:'DEBUG',parent:'help',text:'検証用プレイ・専用ボタン',body:debugGuide};

menuRoutes['help-debug'].items=[['STARRYMARE - DBG','help-debug-normal','通常戦・ボス戦の詳細'],['BOSS RUSH - DBG','help-debug-rush','連戦・DRIVEの詳細']];
menuRoutes['help-debug-normal']={title:'STARRYMARE - DBG',parent:'help-debug',text:'通常戦の検証ガイド',body:()=>debugGuide('debug')};
menuRoutes['help-debug-rush']={title:'BOSS RUSH - DBG',parent:'help-debug',text:'ボスラッシュの検証ガイド',body:()=>debugGuide('rush-debug')};

menuRoutes.controls.body=commonGuide;

try {soundEnabled=localStorage.getItem('star-patrol-sound')==='on';}catch(_){}
function helpPictures(route){
 if(route==='controls')return '<figure class="help-visual"><div class="control-picture"><span>↑<br>←　→<br>↓</span><img src="'+imageData.ship+'" alt="矢印キーで移動する自機"><span>↑ ↑ ↑<br>自動射撃</span></div><figcaption>ドラッグ／矢印キーで移動・攻撃は自動</figcaption></figure>';
 if(route==='items')return '<div class="item-gallery">'+itemTypes.map(t=>'<figure class="help-visual"><canvas width="64" height="64" data-item="'+t.name+'" role="img" aria-label="'+t.name+'のアイコン"></canvas><figcaption><strong>'+t.name+'</strong></figcaption></figure>').join('')+'</div>';
 if(route==='enemies')return '<figure class="help-visual"><div class="enemy-gallery">'+enemySkins.map((key,i)=>'<figure><img src="'+imageData[key]+'" alt="通常敵 '+(i+1)+'：'+enemyMotionNames[i%6]+'" loading="lazy"><figcaption>'+enemyMotionNames[i%6]+'</figcaption></figure>').join('')+'</div><figcaption>通常敵・全29種類</figcaption></figure>';

// Reset transient play state only after the completed/interrupted run is saved.
function resetMenuScene(){
 stopDrag();keys.clear();resetDrive();
 boss=null;attack=null;bossEscorts=[];hostileBullets=[];bullets=[];enemies=[];
 items=[];particles=[];rings=[];notices=[];shake=0;flash=0;
 speedTime=0;fireStacks=0;extraWays=0;buddyCount=0;itemShield=0;
 score=0;life=3;elapsed=0;phase=1;phaseMode='wave';phaseTime=0;transitionTime=0;returnMotion=null;
 spawnTimer=.65;shotTimer=0;escortTimer=1.5;enemySkinCursor=0;
 debugSpeed=1;lowLifeDamage=0;totalDamage=0;comboKills=0;phaseElapsed=0;phaseRecords=[];resultAwarded=false;resultBonus=null;
 player={x:W/2,y:H-65,r:14,invincible:0};
 for(const star of stars){star.x=Math.random()*W;star.y=Math.random()*H;}

function startHomeIntro(focus){
 const token=++homeIntroToken;homeIntroFocus=focus;
 overlay.setAttribute('data-intro','waiting');
 const start=()=>{if(token!==homeIntroToken||state!=='menu'||menuRoute!=='home')return;void overlay.offsetWidth;overlay.setAttribute('data-intro','running');};
 if(document.fonts?.ready)document.fonts.ready.then(start,start);else start();
}
menuPanel.addEventListener('animationend',event=>{
 if(event.animationName!=='home-controls-in'||state!=='menu'||menuRoute!=='home')return;
 overlay.setAttribute('data-intro','complete');
 for(const button of menuPanel.querySelectorAll?.('button')||[])button.disabled=false;
 if(homeIntroFocus)menuPanel.querySelector?.('button')?.focus();
});
function showMenu(route='home',focus=true) {
  const page=menuRoutes[route];if(!page)return;
  document.getElementById('pause-sound').hidden=true;
  selectedMode=null;launchTransition=null;launchFade.hidden=true;
  homeIntroToken++;overlay.setAttribute('data-intro','none');
  const leavingRun=['playing','paused','drive','over','clear'].includes(state);
  if(state==='playing'||state==='paused'||state==='drive')finishHistory('quit');
  if(leavingRun)resetMenuScene();
  document.getElementById('drive-panel').hidden=true;
  document.getElementById('result-details').hidden=true;message.hidden=false;
  overlay.setAttribute('data-state','menu');overlay.setAttribute('data-route',route);
  stopDrag();state='menu';keys.clear();menuRoute=route;overlay.hidden=false;
  phaseLabel.textContent='MAIN MENU';missionLabel.textContent='MENU / '+page.title;
  document.getElementById('pause-button').hidden=true;
  title.textContent=page.title;message.textContent=page.text;
  startButton.hidden=true;menuHome.hidden=true;menuPanel.hidden=false;
  const modeSelection=route==='play'||route==='debug-modes';
  const items=typeof page.items==='function'?page.items():page.items||[];
  const body=typeof page.body==='function'?page.body():page.body||'';
  menuPanel.innerHTML=(body?`<div class="menu-copy">${helpPictures(route)}${body}</div>`:'')+
    '<div class="menu-options'+(route==='home'?' home-menu':modeSelection?' mode-menu':'')+'">'+items.map(([label,action,note])=>`<button type="button" data-action="${action}" aria-label="${label}"${modeSelection&&action.startsWith('start:')?' aria-pressed="false"':action==='toggle-sound'?` aria-pressed="${soundEnabled}"`:''}><strong>${label}</strong>${note?`<small>${note}</small>`:''}${modeSelection?'<span class="mode-state">'+(action.startsWith('start:')?'SELECT':'OPEN')+'</span>':''}</button>`).join('')+
    '</div>';
  document.getElementById('floating-back').hidden=!page.parent;
  overlay.setAttribute('data-back',page.parent?'true':'false');
  paintHelpPictures();
  if(['enemies','help-start','help-rush','help-debug-normal','help-debug-rush'].includes(route))Promise.all(Object.values(sprites).filter(img=>typeof img.decode==='function').map(img=>img.decode().catch(()=>{}))).then(()=>{if(state==='menu' && menuRoute===route)paintHelpPictures();});
  overlay.scrollTop=0;
  if(route==='home'){startHomeIntro(false);if(focus)menuPanel.querySelector?.('button')?.focus();}
  else if(focus)(menuPanel.querySelector?.('button')||document.getElementById('floating-back')).focus?.();
}
function updateLaunchTransition(dt){
 if(!launchTransition)return false;
 const transition=launchTransition;transition.elapsed+=dt;
 const midpoint=.45,end=.9;
 if(transition.elapsed>=midpoint&&!transition.started){transition.started=true;gameMode=transition.mode;reset();}
 const opacity=transition.elapsed<midpoint?transition.elapsed/midpoint:Math.max(0,(end-transition.elapsed)/(end-midpoint));
 launchFade.setAttribute('style','opacity:'+opacity.toFixed(3));
 if(transition.elapsed>=end){launchTransition=null;launchFade.hidden=true;keys.clear();stopDrag();}
 return true;
}
function menuAction(action) {
  if(launchTransition)return;
  if(action==='history-delete'){playHistory=[];activeRun=null;persistHistory();showMenu('history');return;}
  if(action.startsWith('start:')) {
    const mode=action.split(':')[1];if(!modeNames[mode])return;
    if(state!=='menu'||!['play','debug-modes'].includes(menuRoute))return;
    if(selectedMode!==mode){
      selectedMode=mode;
      for(const button of menuPanel.querySelectorAll?.('button[data-action]')||[]){
        const selected=button.dataset.action===action;button.setAttribute('aria-pressed',String(selected));
        const label=button.querySelector('.mode-state');if(label)label.textContent=selected?'LOCKED · もう一度押して出撃':'SELECT';
      }
      message.textContent=modeNames[mode]+' を選択中。同じボタンをもう一度押すと出撃。';
      return;
    }
    launchTransition={mode,elapsed:0,started:false};launchFade.setAttribute('style','opacity:0');launchFade.hidden=false;
    keys.clear();stopDrag();return;
  }
  if(action==='toggle-sound') {
    toggleSound();showMenu('sound');return;
  }
  showMenu(action);
}
menuPanel.addEventListener('click',event=>{
  const button=event.target.closest('button[data-action]');
  if(button)menuAction(button.dataset.action);
});
menuHome.addEventListener('click',()=>showMenu('home'));
document.getElementById('floating-back').addEventListener('click',()=>{if(state==='menu'&&menuRoutes[menuRoute].parent)showMenu(menuRoutes[menuRoute].parent);});
document.getElementById('pause-button').addEventListener('click',()=>{if(state==='playing')pause();else if(state==='paused')resume();});
window.addEventListener('keydown',event=>{
  if(state==='menu') {
    if(event.code==='Escape'){event.preventDefault();if(menuRoute!=='home')showMenu(menuRoutes[menuRoute].parent||'home');}
    if(event.code==='ArrowDown'||event.code==='ArrowUp') {
      event.preventDefault();const buttons=[...menuPanel.querySelectorAll('button')].filter(button=>!button.disabled);if(menuRoutes[menuRoute].parent)buttons.push(document.getElementById('floating-back'));
      if(!buttons.length)return;const index=buttons.indexOf(document.activeElement);
      buttons[(index+(event.code==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus();
    }
  } else if(event.code==='Escape'&&!event.repeat) {event.preventDefault();if(state==='playing')pause();else if(state==='paused')resume();}
});

const itemTypes=[{name:'SHIELD',chance:.07,color:'#73eaff'},{name:'1WAY',chance:.07,color:'#ffdc70'},{name:'BUDDY',chance:.04,color:'#b4a1ff'},{name:'LIFE',chance:.03,color:'#ff8caf',debugGrant:false},{name:'SPEED',chance:.02,color:'#7fffc1'},{name:'FIRE',chance:.04,color:'#ff5252'}];
let speedTime=0,fireStacks=0;
let items=[],extraWays=0,buddyCount=0,itemShield=0;
function squadPositions(){
  const ships=[{x:player.x,y:player.y}];
  for(let i=0;i<buddyCount;i++)ships.push({x:Math.max(20,Math.min(W-20,player.x+(i===0?-42:42))),y:Math.min(H-24,player.y+18)});
  return ships;
}
function dropEscortItems(x,y){
 const count=1+Math.floor(Math.random()*(isRushMode()?5:3));
 for(let i=0;i<count;i++)dropGuaranteedItem(Math.max(18,Math.min(W-18,x+(i-(count-1)/2)*26)),y-Math.abs(i-(count-1)/2)*12);
 return count;
}
function dropGuaranteedItem(x,y){return dropItem(x,y,Math.random()*itemTypes.reduce((sum,t)=>sum+t.chance,0));}
function dropItem(x,y,roll=Math.random()){
  let threshold=0;
  for(const type of itemTypes){threshold+=type.chance;if(roll<threshold){items.push({type:type.name,x,y,age:0});return type.name;}}
  return null;
}
function collectItem(name){
  let label=name;
  const overflow=(name==='FIRE'&&fireStacks>=FIRE_MAX_STACKS)||(name==='1WAY'&&extraWays>=4)||(name==='BUDDY'&&buddyCount>=2)||(name==='LIFE'&&life>=3);
  if(overflow){score+=50;notices.push({x:player.x,y:player.y-45,text:'OVERFLOW +50',life:1.2});tone(700,.14);updateHUD();return;}
  if(name==='SPEED'){speedTime+=10;label='SPEED +10 SEC';}
  if(name==='FIRE'){fireStacks=Math.min(FIRE_MAX_STACKS,fireStacks+1);label='FIRE ×'+(1+fireStacks/10).toFixed(1)+(fireStacks===FIRE_MAX_STACKS?' MAX':'');}
  if(name==='SHIELD'){itemShield+=1.5;label='SHIELD +1.5 SEC';}
  if(name==='1WAY'){extraWays=Math.min(4,extraWays+1);label=(extraWays+1)+' DIRECTIONS';}
  if(name==='BUDDY'){buddyCount=Math.min(2,buddyCount+1);label='BUDDY '+(buddyCount+1)+' SHIPS';}
  if(name==='LIFE'){life=Math.min(3,life+1);label=life===3?'LIFE / MAX 3':'LIFE +1';}
  notices.push({x:player.x,y:player.y-45,text:label,life:1.2});tone(700,.14);updateHUD();
}
function resetPhasePower(){
  
  const expired=[];if(extraWays){expired.push('1WAY');burst(player.x,player.y,'#ffdc70');}
  if(expired.length){rings.push({x:player.x,y:player.y,life:.5,color:'#c9baff'});notices.push({x:W/2,y:H-150,text:'PHASE RESET · '+expired.join(' / '),life:2});}
  extraWays=0;
}
// Shot appearance is captured at emission, just like its damage.
const SHOT_STYLES=Object.freeze([
 {tier:'normal',color:'#8effed'},{tier:'bolt',color:'#ffffff'},
 {tier:'diamond',color:'#459cff'},{tier:'spear',color:'#ff4545'},
 {tier:'laser',color:'#ffe34c'}
].map(style=>Object.freeze(style)));
function shotStyle(level){return SHOT_STYLES[level>=10?4:level>=7?3:level>=4?2:level>=1?1:0];}
function drawPlayerBullet(b){
 const style=shotStyle(b.fireLevel??(b.fire?1:0));
 if(style.tier==='normal'){
  if(!sprite('laser',b.x,b.y,9,27)){ctx.fillStyle=style.color;ctx.fillRect(b.x-2,b.y-10,4,16);}
  return;
 }
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vx||0,-(b.vy??-520)));
 ctx.shadowColor=style.color;ctx.shadowBlur=style.tier==='laser'?22:14;ctx.fillStyle=style.color;
 if(style.tier==='bolt'){
  ctx.beginPath();ctx.ellipse(0,0,3,12,0,0,Math.PI*2);ctx.fill();
 }else if(style.tier==='diamond'){
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(6,0);ctx.lineTo(0,13);ctx.lineTo(-6,0);ctx.closePath();ctx.fill();
 }else if(style.tier==='spear'){
  for(const x of [-4,4]){ctx.beginPath();ctx.moveTo(x,-23);ctx.lineTo(x+3,10);ctx.lineTo(x,5);ctx.lineTo(x-3,10);ctx.closePath();ctx.fill();}
 }else{
  ctx.fillRect(-5,-38,10,62);ctx.fillStyle='#fffbd0';ctx.fillRect(-2,-38,4,62);
 }
 ctx.restore();
}
const SHOT_VELOCITIES=Array.from({length:5},(_,ways)=>Array.from({length:ways+1},(_,i)=>{
 const angle=(i-ways/2)*.16;return {vx:Math.sin(angle)*520,vy:-Math.cos(angle)*520};
}));
function fireSquad(){
  for(const p of squadPositions())for(const velocity of SHOT_VELOCITIES[extraWays])bullets.push({x:p.x,y:p.y-22,r:4,damage:1+fireStacks/10,fire:fireStacks>0,fireLevel:fireStacks,vx:velocity.vx,vy:velocity.vy});
  shotTimer=.14/(isRushMode()&&driveRapid>0?1.5:1);tone(850,.06,'triangle');
}
function updateItems(dt){
  speedTime=Math.max(0,speedTime-dt);
  itemShield=Math.max(0,itemShield-dt);
  for(const item of items){item.y+=55*dt;item.age+=dt;
  }
  if(phaseMode!=='transition')for(let i=items.length-1;i>=0;i--){const item=items[i];if(item.age<10 && squadPositions().some(p=>Math.hypot(p.x-item.x,p.y-item.y)<29)){collectItem(item.type);items.splice(i,1);}}
  items=items.filter(i=>i.age<10 && i.y<H+30);
}

function drawItemIcon(name,x,y,context=ctx){
 const ctx=context;
 const type=itemTypes.find(t=>t.name===name);ctx.save();ctx.translate(x,y);ctx.fillStyle='#12243c';ctx.strokeStyle=type.color;ctx.shadowColor=type.color;ctx.shadowBlur=12;ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=type.color;
 if(name==='SHIELD'){ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,-7);ctx.lineTo(7,4);ctx.lineTo(0,11);ctx.lineTo(-7,4);ctx.lineTo(-9,-7);ctx.closePath();ctx.stroke();}
 if(name==='1WAY'){for(const dx of [-9,0,9]){ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(dx,-8);ctx.lineTo(dx-3,-4);ctx.moveTo(dx,-8);ctx.lineTo(dx+3,-4);ctx.stroke();}}
 if(name==='BUDDY'){for(const dx of [-8,8]){ctx.beginPath();ctx.moveTo(dx,-9);ctx.lineTo(dx-5,7);ctx.lineTo(dx,3);ctx.lineTo(dx+5,7);ctx.closePath();ctx.fill();}}
 if(name==='SPEED'){ctx.lineWidth=3;for(const x of [-7,3]){ctx.beginPath();ctx.moveTo(x-4,-9);ctx.lineTo(x+4,0);ctx.lineTo(x-4,9);ctx.stroke();}}
 if(name==='FIRE'){ctx.beginPath();ctx.moveTo(0,-13);ctx.bezierCurveTo(2,-3,13,0,9,9);ctx.bezierCurveTo(4,16,-12,11,-9,2);ctx.lineTo(-4,-5);ctx.lineTo(-3,3);ctx.closePath();ctx.fillStyle='#ff5252';ctx.fill();ctx.stroke();}
 if(name==='LIFE'){ctx.fillRect(-3,-11,6,22);ctx.fillRect(-11,-3,22,6);}
 ctx.restore();
}
function drawItemsAndBuddies(){
  ctx.save();ctx.textAlign='center';ctx.font='bold 10px system-ui';
  for(const item of items){ctx.globalAlpha=Math.max(0,Math.min(1,(10-item.age)/2,(H+20-item.y)/60));drawItemIcon(item.type,item.x,item.y);}
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  for(const p of squadPositions().slice(1)){sprite('flame',p.x,p.y+20,9,20);sprite('ship',p.x,p.y,36,36);if(player.invincible>0||itemShield>0)sprite('shield',p.x,p.y,57,57);}
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.textAlign='left';ctx.fillStyle='#c9e9ff';ctx.font='10px system-ui';
  if(state==='playing')ctx.fillText(`SHOT ${extraWays+1}WAY  /  SHIPS ${buddyCount+1}  /  SHIELD ${itemShield.toFixed(1)}s`,12,H-10);

  ctx.restore();
}

let debugSpeed=1,lowLifeDamage=0;
let totalDamage=0,comboKills=0,phaseElapsed=0,phaseRecords=[],resultAwarded=false,resultBonus=null;
function comboMultiplier(){return isRushMode()?1+Math.min(15,Math.max(0,Math.floor(comboKills/10)-1))*.2:1+Math.min(5,Math.floor(comboKills/10))/10;}
function phaseMultiplier(){return 1+Math.min(5,phase-1)/10;}
function registerShotHit(){if(isRushMode())comboKills++;}
function awardKill(base){if(!isRushMode())comboKills++;const points=Math.round(base*comboMultiplier()*phaseMultiplier());score+=points;return points;}
function pilotAward(seconds){
 // Remove accumulated sub-nanosecond error without rounding real sub-second times.
 const nanoseconds=Math.round(seconds*1e9);
 return nanoseconds<(isRushMode()?25:50)*1e9?'LIGHTNING':nanoseconds<(isRushMode()?35:65)*1e9?'QUICK':'';
}
function damageClass(damage=totalDamage){return damage===0?'COLONEL':damage<=10?'MAJOR':damage<=20?'CAPTAIN':'CREW';}
function recordPhase(skipped=false){
 if(phaseRecords.some(r=>r.phase===phase))return;
 const award=skipped?'':pilotAward(phaseElapsed);
 phaseRecords.push({phase,seconds:phaseElapsed,award,skipped});
 if(award)notices.push({x:W/2,y:H/2-60,text:award,life:2.8});
}
function finalizeResult(){
 if(resultAwarded)return;resultAwarded=true;
 const rank=damageClass(),classPoints=({COLONEL:10000,MAJOR:5000,CAPTAIN:3000,CREW:0})[rank];
 const todPoints=phaseRecords.reduce((sum,r)=>sum+(r.award==='LIGHTNING'?5000:r.award==='QUICK'?2000:0),0);
 const lifePoints=Math.max(0,life)*1000;
 resultBonus={rank,classPoints,todPoints,lifePoints,baseScore:score};score+=classPoints+todPoints+lifePoints;
 scoreLabel.textContent=String(score).padStart(5,'0');
}
function resultHTML(){
 const b=resultBonus;
 const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const row=(label,value)=>'<tr><th scope="row">'+escape(label)+'</th><td class="result-colon">:</td><td>'+escape(value)+'</td></tr>';
 let html='<table class="result-table"><tbody><tr><th colspan="3" class="result-section">RESULT</th></tr>';
 html+=row('CLASS',b.rank)+row('DAMAGE',totalDamage)+row('PLAY SCORE',b.baseScore.toLocaleString())+row('CLASS BONUS','+'+b.classPoints.toLocaleString())+row('TOD BONUS','+'+b.todPoints.toLocaleString())+row('LIFE BONUS','+'+b.lifePoints.toLocaleString())+row('FINAL SCORE',score.toLocaleString())+row('LIFE',life);
 if(isDebugMode())html+=row('LOW LIFE DAMAGE',lowLifeDamage);
 html+='<tr><th colspan="3" class="result-section">TOUR OF DUTY</th></tr>';
 for(let i=1;i<=MAX_PHASES;i++){
  const r=phaseRecords.find(r=>r.phase===i);
  html+=row('PHASE '+i,r?r.seconds.toFixed(2)+'s / '+(r.skipped?'SKIPPED':r.award||'称号なし'):i===phase?phaseElapsed.toFixed(2)+'s / 未完了':'—');
 }
 return html+'</tbody></table>';
}
function resultSummary(){
 const b=resultBonus;
 const rows=Array.from({length:MAX_PHASES},(_,i)=>{
  const r=phaseRecords.find(r=>r.phase===i+1);
  return 'PHASE '+(i+1)+'：'+(r?r.seconds.toFixed(2)+'s'+(r.skipped?' / SKIPPED':r.award?' / '+r.award:''):i+1===phase?phaseElapsed.toFixed(2)+'s / 未完了':'—');
 });
 return '\nCLASS：'+b.rank+' / Damage '+totalDamage+'\nPLAY SCORE：'+b.baseScore+'\nCLASS BONUS：+'+b.classPoints+' / TOD BONUS：+'+b.todPoints+' / LIFE BONUS：+'+b.lifePoints+'\nFINAL SCORE：'+score+'\nTOUR OF DUTY\n'+rows.join('\n');
}
function debugItemAction(action){
 if(!isDebugMode()||state!=='playing'||phaseMode==='transition')return;
 if(action==='RESET'){extraWays=0;buddyCount=0;itemShield=0;speedTime=0;fireStacks=0;life=3;updateHUD();rings.push({x:player.x,y:player.y,life:.5,color:'#c9baff'});notices.push({x:player.x,y:player.y-40,text:'ITEM RESET',life:1});}
 else if(itemTypes.some(type=>type.name===action&&type.debugGrant!==false))collectItem(action);
}
// Every grantable item gets a button directly from the item catalog.
function debugItemButtonId(type){return 'debug-item-'+type.name.toLowerCase();}
let debugItemButtons=[];
function buildDebugItemButtons(){
 debugItemButtons=[];
 document.getElementById('debug-items').innerHTML=itemTypes.filter(type=>type.debugGrant!==false).map(type=>'<button id="'+debugItemButtonId(type)+'" type="button" title="'+type.name+'を1個取得" aria-label="'+type.name+'を1個取得">'+type.name+'</button>').join('');
 for(const type of itemTypes.filter(type=>type.debugGrant!==false)){
  const button=document.getElementById(debugItemButtonId(type));debugItemButtons.push(button);
  button.addEventListener('click',()=>{debugItemAction(type.name);button.blur();});
 }
}
buildDebugItemButtons();
document.getElementById('debug-reset').addEventListener('click',()=>{debugItemAction('RESET');document.getElementById('debug-reset').blur();});
function refreshDebugControls(){
 const disabled=state!=='playing'||phaseMode==='transition';
 for(const button of debugItemButtons)setFlag(button,'disabled',disabled);
 setFlag(ui['debug-reset'],'disabled',disabled);
 setFlag(ui['debug-controls'],'hidden',!isDebugMode()||!['playing','paused'].includes(state));
 setAttributeValue(ui['debug-speed'],'aria-pressed',String(debugSpeed>1));
 setText(ui['debug-rate'],'×'+debugSpeed);
 setFlag(ui['debug-speed'],'disabled',state!=='playing');
 setFlag(ui['debug-skip'],'disabled',disabled||phaseMode==='entry');
}
function toggleDebugSpeed(){if(isDebugMode()&&state==='playing'){debugSpeed=debugSpeed%3+1;refreshDebugControls();}}
function skipDebugPhase(){
 if(!isDebugMode()||state!=='playing'||phaseMode==='transition'||phaseMode==='entry')return;
 if(phaseMode==='wave'){stopDrag();keys.clear();enterBoss();refreshDebugControls();return;}

 const distance=Math.hypot(dx,dy);

function update(dt) {
  if(state !== 'playing') return;
  updateDrive(dt);
  elapsed += dt;
  if(phaseMode!=='transition')phaseElapsed+=dt;
  for (const star of stars) { star.y = (star.y + star.speed*dt) % H; }
  let dx = Number(keys.has('ArrowRight')) - Number(keys.has('ArrowLeft'));
  let dy = Number(keys.has('ArrowDown')) - Number(keys.has('ArrowUp'));
  if(dragControl){dx=dragControl.dx;dy=dragControl.dy;}
  const length = Math.hypot(dx,dy) || 1;
  const travel=290*(speedTime>0?1.3:1)*dt;
  if(phaseMode !== 'transition') {
  player.x = Math.max(20, Math.min(W-20, player.x+dx/length*travel));
  player.y = Math.max(24, Math.min(H-24, player.y+dy/length*travel));
  }
  player.invincible = Math.max(0, player.invincible-dt);
  updateItems(dt);
  const enemyDt=dt;
  shotTimer -= dt;
  if (phaseMode !== 'transition' && shotTimer <= 0) {
    fireSquad();
  }
  spawnTimer -= dt;
  if (phaseMode === 'wave' && phaseTime < WAVE_SECONDS && spawnTimer <= 0) {
    spawnNormalEnemy();
    spawnTimer += ENEMY_SPAWN_INTERVALS[phase-1];
  }
  for (const bullet of bullets) {bullet.x+=(bullet.vx||0)*dt;bullet.y+=(bullet.vy??-520)*dt;}
  // 後ろから処理し、削除による要素の飛ばしを防ぐ。
  for (let i=enemies.length-1; i>=0; i--) {
    const enemy = enemies[i]; moveNormalEnemy(enemy,enemyDt);
    const hit = bullets.findIndex(b => Math.hypot(b.x-enemy.x,b.y-enemy.y)<b.r+enemy.r);
    if (hit !== -1) {
      registerShotHit();enemy.hp=Math.round(((enemy.hp??1)-(bullets[hit].damage??1))*10)/10;bullets.splice(hit,1);
      if(enemy.hp<=0){enemies.splice(i,1);const killPoints=awardKill(100);
        dropItem(enemy.x,enemy.y);burst(enemy.x,enemy.y,'#ffb879');tone(160,.12,'triangle');notices.push({x:enemy.x,y:enemy.y,text:'+'+killPoints,life:.7});updateHUD();continue;
      }
      rings.push({x:enemy.x,y:enemy.y,life:.12,color:'#d8f7ff'});
    }
    if (Math.hypot(player.x-enemy.x,player.y-enemy.y)<player.r+enemy.r) {
      enemies.splice(i,1); burst(enemy.x,enemy.y,'#ff768d'); damage();
    } else if (enemy.y-enemy.r > H) {
      enemies.splice(i,1); // 画面外への通過ではライフを減らさない。
    } else {
      if(enemy.y>=0)enemy.fireTimer = (enemy.fireTimer ?? 1)-enemyDt;
      if(enemy.fireTimer <= 0 && enemy.y >= 0 && enemy.y < H-90) {
        // 発射時点の自機を狙う。発射後は追尾せず、移動で回避できる。
        fireNormalEnemy(enemy);
      }
    }
    if (state !== 'playing') break;
  }
  updatePhase(dt);
  bullets = bullets.filter(b => b.y > -12 && b.x>-20 && b.x<W+20);
  for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0,shake-dt*30); flash = Math.max(0,flash-dt);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  for (const n of notices) { n.life -= dt; n.y -= 20*dt; }
  notices = notices.filter(n => n.life > 0);
}

 ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=d.color;ctx.shadowColor=d.color;ctx.shadowBlur=14;
 const inward=d.shape==='collapse'||d.shape==='horizon';
 for(const mote of d.motes||[]){const radius=mote.radius*(inward?1-t:t);const angle=mote.angle+(d.shape==='horizon'?t*3:0);ctx.globalAlpha=(1-t)*.85;ctx.beginPath();ctx.arc(cx+Math.cos(angle)*radius,cy+Math.sin(angle)*radius,mote.size*(1-t*.6),0,Math.PI*2);ctx.fill();}
 // Two broad light pulses over 1.5 seconds, not rapid strobing.
 ctx.globalAlpha=Math.max(0,Math.sin(t*Math.PI*4))*.18*(1-t);ctx.fillRect(0,0,W,H);ctx.restore();
 ctx.save();ctx.globalAlpha=Math.sin(Math.PI*t)*.65;ctx.fillStyle=d.color;ctx.fillRect(0,0,W,H);ctx.globalAlpha=(1-t)*.8;ctx.strokeStyle=d.color;ctx.shadowColor=d.color;ctx.shadowBlur=20;ctx.lineWidth=4;
 if(d.shape==='cascade'){for(let i=0;i<12;i++){const x=(i*59+t*W)%W;ctx.beginPath();ctx.moveTo(x-120,0);ctx.lineTo(x+120,H);ctx.stroke();}}
 else if(d.shape==='grid'){for(let i=0;i<10;i++){ctx.strokeRect(cx-i*35*(t+.2),cy-i*50*(t+.2),i*70*(t+.2),i*100*(t+.2));}}
 else {for(let i=0;i<6;i++){const r=d.shape==='collapse'?(1-t)*(i+1)*110:(t+.05)*(i+1)*100;ctx.beginPath();ctx.arc(cx,cy,Math.max(1,r),0,Math.PI*2);ctx.stroke();}if(d.shape==='horizon'){ctx.fillStyle='#080518';ctx.beginPath();ctx.arc(cx,cy,90*Math.sin(Math.PI*t),0,Math.PI*2);ctx.fill();}}
 ctx.restore();
}
document.getElementById('drive-button').addEventListener('click',openDrive);
document.getElementById('drive-panel').addEventListener('click',event=>{const button=event.target.closest('[data-drive]');if(!button)return;if(button.dataset.drive==='cancel')cancelDrive();else activateDrive(Number(button.dataset.drive));});
window.addEventListener('keydown',event=>{if(state!=='drive')return;if(event.code==='Escape'){event.preventDefault();cancelDrive();}if(event.code==='Tab'){const buttons=[...document.getElementById('drive-panel').querySelectorAll('button')];if(buttons.length){event.preventDefault();const i=buttons.indexOf(document.activeElement);buttons[(i+(event.shiftKey?-1:1)+buttons.length)%buttons.length].focus();}}});

function frame(time) {
  // 長時間タブが非表示になった場合も、急に大きく移動しない。
  const dt = Math.min((time-lastTime)/1000,.033); lastTime = time;
  const launching=updateLaunchTransition(dt);
  if (!launching && state === 'playing') {const steps=isDebugMode()?debugSpeed:1;for(let i=0;i<steps && state==='playing';i++)update(dt);}
  refreshDebugControls();refreshDriveHUD();
  draw();drawDriveEffect();requestAnimationFrame(frame);
}
player = { x: W/2, y: H-65, r: 14, invincible: 0 };
showMenu('home',false);
requestAnimationFrame(frame);
